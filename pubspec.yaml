name: notebook
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  sqflite: ^2.3.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  get_storage: ^2.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # --- تنبيه لو في اخطاء بالكود   ---
  flutter_lints: ^6.0.0

  file_picker: ^8.0.0



  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - images/

